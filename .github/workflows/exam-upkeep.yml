name: Exam upkeep

# Weekly: keeps every exam in step with the real one, without a person.
# scripts/exam-upkeep.ts picks up to 3 tasks: dated changes to real exams
# (lib/examFreshness.json) due or taking effect within 7 days, then yearly
# reviews (exams not changed or reviewed in a year), oldest first. Claude Code
# does each one from the official sources, a second Claude Code run that did
# not write the change checks it, and the PR merges itself when the reviewer has
# no objection and scripts/automerge-checks.sh passes. Otherwise the PR is
# closed and its tasks are tried again next week; a task that fails three times
# is skipped (examUpkeep/{key} in Firestore) so it never blocks the rest.
#
# Needs repository secrets ANTHROPIC_API_KEY and FIREBASE_SERVICE_ACCOUNT_KEY.

on:
  schedule:
    - cron: "41 5 * * 3" # Wednesdays 05:41 UTC
  workflow_dispatch:
    inputs:
      max:
        description: "Most tasks to do in this run"
        default: "3"

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: exam-upkeep
  cancel-in-progress: false

jobs:
  upkeep:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: API budget (fix)
        id: budget_fix
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npx tsx scripts/api-budget.ts check exam-upkeep 8

      - name: Pick this week's tasks
        id: pick
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          MAX_INPUT: ${{ github.event.inputs.max }}
        run: |
          max="${MAX_INPUT:-3}"
          case "$max" in ''|*[!0-9]*) echo "max must be a whole number"; exit 1 ;; esac
          f="$RUNNER_TEMP/upkeep.json"
          n=$(npx tsx scripts/exam-upkeep.ts --pick "$f" --max "$max" | tail -1)
          # Out of API budget this month: no tasks this week.
          if [ "${{ steps.budget_fix.outputs.ok }}" != "true" ]; then n=0; fi
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          mkdir -p audits/upkeep
          echo "report=audits/upkeep/$(date -u +%F)-${{ github.run_id }}.md" >> "$GITHUB_OUTPUT"
          cat "$f"

      # Workaround for anthropics/claude-code-action#1901 (see question-audit.yml).
      - name: Claude Code wrapper (action#1901)
        if: steps.pick.outputs.count != '0'
        run: |
          [ -x "$HOME/.local/bin/claude" ] || curl -fsSL https://claude.ai/install.sh | bash
          printf '#!/bin/sh\nunset CLAUDE_CODE_ENTRYPOINT CLAUDE_CODE_ACTION\nexec "%s" "$@"\n' "$HOME/.local/bin/claude" > "$RUNNER_TEMP/claude"
          chmod +x "$RUNNER_TEMP/claude"

      - name: Do the tasks with Claude Code
        id: fix
        if: steps.pick.outputs.count != '0'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ runner.temp }}/claude
          show_full_output: true
          claude_args: --max-budget-usd ${{ steps.budget_fix.outputs.cap }} --max-turns 400 --disallowedTools "Agent,Task,Workflow,Monitor,ScheduleWakeup,TaskStop,SendMessage" --add-dir ${{ runner.temp }} /tmp --allowedTools "Read,Edit,Write,Glob,Grep,WebFetch,WebSearch,Bash(curl:*),Bash(python3:*),Bash(npx tsx:*),Bash(git diff:*),Bash(git status:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(wc:*),Bash(grep:*),Bash(ls:*),Bash(pdftotext:*)"
          prompt: |
            Read CLAUDE.md, docs/claude/question-quality.md and each task's docs/exams/<examId>.md and
            .claude/skills/exam-bank/SKILL.md, then ${{ steps.pick.outputs.file }}. Nobody
            reviews this work by hand: a second reviewer checks it and it is merged. You
            own keeping these exams in step with the real ones.

            Each task is one of:

            - change: a dated change to the real exam (its "event" from
              lib/examFreshness.json: what, action, source). Read the source and the
              exam body's current pages (WebFetch). If the change is published and in
              effect (or takes effect within 7 days), make it: bank sources (never only
              the built JSON) then the exam's build script, every translated bank of the
              exam, blueprint and sets in its config, lib/examFacts.ts, lib/examCosts.json,
              the landing, the docs/exams/<examId>.md notes and a dated note in its sources.md. Then set
              "done" on the event to today's date. If the official body has not published
              it yet, or it is further off than the event says, change nothing else and
              set "recheck" on the event to the date to look again (30 days on, or the new
              date), with the reason in "what" if it changed. If the change turns out not
              to touch anything we ask or state, set "done" and say so in the report.

            - review: a yearly review of one exam. Read its official outline, handbook or
              rules page (the exam's sources.md names them) and check everything Tigertest
              states against it today: format, length, time, pass mark, fees, topic weights,
              the blueprint and sets, lib/examFacts.ts, the landing and the docs/exams/<examId>.md notes,
              and the questions that state rules, figures or dates (search the bank for
              years, money, limits). Fix what moved, as for a change. Then write today's
              date for the exam in lib/examReviews.json (keep the file sorted by key).

            Official sources only: a question, key, explanation or fact may change only
            when you read the change yourself on the exam owner's, the government's or
            the regulator's own page, or in the primary law or standard. Prep sites, news
            and forums are never enough. Record each official URL you used, dated, in the
            exam's sources.md. A big rebuild (new domains, a new format) follows the
            exam-bank skill: original questions only, every key checked, the exam's
            validator passing.

            After your changes run python3 -I tools/build_exam_sources.py if you changed a
            sources.md, and for every bank you changed: python3 -I tools/check_banks.py,
            npx tsx scripts/build-training-parts.ts, the exam's validator, and
            npx tsx scripts/build-landing-dates.ts. Fix what they report.

            Write ${{ steps.pick.outputs.report }}: a short Markdown summary, one section per
            task: what you checked, the official sources, and what you changed (or why
            nothing needed to change). Do not commit.

      - name: Record API spend (fix)
        if: always() && (steps.fix.outcome == 'success' || steps.fix.outcome == 'failure')
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npx tsx scripts/api-budget.ts record exam-upkeep --file "${{ steps.fix.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}"

      - name: API budget (verify)
        id: budget_verify
        if: steps.pick.outputs.count != '0' && steps.fix.outcome == 'success'
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npx tsx scripts/api-budget.ts check exam-upkeep 3

      - name: Verify independently
        id: verify
        if: steps.pick.outputs.count != '0' && steps.fix.outcome == 'success' && steps.budget_verify.outputs.ok == 'true'
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          path_to_claude_code_executable: ${{ runner.temp }}/claude
          show_full_output: true
          claude_args: --max-budget-usd ${{ steps.budget_verify.outputs.cap }} --max-turns 200 --disallowedTools "Agent,Task,Workflow,Monitor,ScheduleWakeup,TaskStop,SendMessage" --allowedTools "Read,Write,Glob,Grep,WebFetch,WebSearch,Bash(git diff:*),Bash(git status:*),Bash(python3:*)"
          prompt: |
            You are the second reviewer of an automatic update to Tigertest's exams
            (tasks in ${{ steps.pick.outputs.file }}, summary in
            ${{ steps.pick.outputs.report }}). Nobody else reads it before students see
            it. Do not edit any repository file; your only output is the verdict file.

            Run git status and git diff to see every change. Check each changed question,
            fact, figure and blueprint against the official source yourself (WebFetch).
            Object when: a change is not supported by an official source you read; a key
            is wrong or another option is also defensible; an explanation contradicts its
            key; a translated bank still has an old key; only built JSON changed and not
            its source; a task was marked done or reviewed without the work it needs.
            Do not object over wording you would merely have written differently.

            Write ${{ runner.temp }}/verify.json:
            { "ok": true or false, "objections": [ { "what": "...", "why": "one sentence" } ] }

      - name: Record API spend (verify)
        if: always() && (steps.verify.outcome == 'success' || steps.verify.outcome == 'failure')
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npx tsx scripts/api-budget.ts record exam-upkeep --file "${{ steps.verify.outputs.execution_file || format('{0}/claude-execution-output.json', runner.temp) }}"

      - name: Check the work
        id: checks
        if: steps.pick.outputs.count != '0'
        continue-on-error: true
        run: bash scripts/automerge-checks.sh

      - name: Read the verdict
        id: verdict
        if: steps.pick.outputs.count != '0'
        run: |
          f="$RUNNER_TEMP/verify.json"
          ok=false
          note="The second reviewer wrote no verdict."
          if [ -f "$f" ]; then
            ok=$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); print("true" if v.get("ok") is True and not v.get("objections") else "false")' "$f" || echo false)
            note=$(python3 -c 'import json,sys; v=json.load(open(sys.argv[1])); o=v.get("objections") or []; print("Second reviewer: no objections." if not o else "Second reviewer objections:"); [print("- %s: %s" % (x.get("what","?"), x.get("why",""))) for x in o]' "$f" || echo "The verdict file could not be read.")
          fi
          [ -f "${{ steps.pick.outputs.report }}" ] || echo "# Exam upkeep" > "${{ steps.pick.outputs.report }}"
          { echo; echo "## Second review"; echo; echo "$note"; } >> "${{ steps.pick.outputs.report }}"
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          { echo "note<<EOF_NOTE"; echo "$note"; echo "EOF_NOTE"; } >> "$GITHUB_OUTPUT"

      - name: Open PR
        id: pr
        if: steps.pick.outputs.count != '0'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: exam-upkeep/${{ github.run_id }}
          title: "Exam upkeep: ${{ steps.pick.outputs.count }} tasks"
          commit-message: "Exam upkeep: dated changes and yearly reviews"
          body-path: ${{ steps.pick.outputs.report }}
          add-paths: |
            audits/upkeep/**
            data/**
            tools/**
            lib/**
            app/**
            components/**
            docs/exams/**
            docs/claude/**
            CLAUDE.md

      - name: Merge
        id: merge
        if: steps.pr.outputs.pull-request-number && steps.fix.outcome == 'success' && steps.verdict.outputs.ok == 'true' && steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch

      # Nobody reviews these by hand: close the PR, count a failure, try again next week.
      - name: Close it for a retry
        if: steps.pick.outputs.count != '0' && steps.merge.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          NOTE: ${{ steps.verdict.outputs.note }}
        run: |
          if [ -n "${{ steps.pr.outputs.pull-request-number }}" ]; then
            gh pr close "${{ steps.pr.outputs.pull-request-number }}" --delete-branch --comment "Not merged automatically, so closed; these tasks are tried again next week (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}).

          - Work step: ${{ steps.fix.outcome }}
          - Second review: ${{ steps.verdict.outputs.ok == 'true' && 'no objections' || 'objections or no verdict' }}
          - Checks: ${{ steps.checks.outcome }}

          $NOTE

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
          fi
          npx tsx scripts/exam-upkeep.ts --failed "${{ steps.pick.outputs.file }}"
