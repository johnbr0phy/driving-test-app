name: Mobile iOS Release (TestFlight)

# Archives, signs, and uploads the iOS app to App Store Connect from a
# GitHub macOS runner — no local Mac/Xcode needed. Uses Xcode
# cloud-managed automatic signing via an App Store Connect API key.
#
# Required repo secrets (see docs/APP_STORE_DEPLOYMENT.md):
#   APPLE_TEAM_ID        — 10-char Team ID (developer.apple.com → Membership)
#   APPSTORE_ISSUER_ID   — App Store Connect → Users and Access → Integrations
#   APPSTORE_KEY_ID      — ID of the API key (create with Admin role)
#   APPSTORE_P8_BASE64   — base64 of the downloaded AuthKey_XXXX.p8
#
# The build number is the workflow run number, so every run uploads a
# newer build automatically. Marketing version comes from the optional
# repo variable IOS_MARKETING_VERSION (default 1.0).
on:
  workflow_dispatch:

jobs:
  release:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Write App Store Connect API key
        run: |
          mkdir -p "$HOME/private_keys"
          echo "${{ secrets.APPSTORE_P8_BASE64 }}" | base64 -d > "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8"

      - name: Archive (cloud-managed signing)
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            MARKETING_VERSION="${{ vars.IOS_MARKETING_VERSION || '1.0' }}" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}" \
            archive

      - name: Export and upload to App Store Connect
        run: |
          cd ios/App
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>upload</string>
            <key>signingStyle</key>
            <string>automatic</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$HOME/private_keys/AuthKey_${{ secrets.APPSTORE_KEY_ID }}.p8" \
            -authenticationKeyID "${{ secrets.APPSTORE_KEY_ID }}" \
            -authenticationKeyIssuerID "${{ secrets.APPSTORE_ISSUER_ID }}"
