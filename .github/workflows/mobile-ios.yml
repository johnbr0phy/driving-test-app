name: Mobile iOS Build

# Builds the iOS app for the iPhone Simulator on GitHub's macOS runners
# and uploads it as an artifact. The .app zip can be run without a Mac at
# https://appetize.io (browser-based simulator) or dropped onto a local
# simulator. A signed device/App Store build requires Apple Developer
# certificates — see docs/APP_STORE_DEPLOYMENT.md.
on:
  workflow_dispatch:
  push:
    branches: [main, claude/tigertest-mobile-app-so7lbd]
    paths: ["mobile/**", ".github/workflows/mobile-ios.yml"]

jobs:
  ios-simulator:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Capacitor sync
        run: npx cap sync ios

      - name: Build for iPhone Simulator
        run: |
          cd ios/App
          xcodebuild -project App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Zip simulator app
        run: |
          cd ios/App/DerivedData/Build/Products/Debug-iphonesimulator
          zip -r TigerTest-Simulator.zip App.app

      - name: Upload simulator app
        uses: actions/upload-artifact@v4
        with:
          name: tigertest-ios-simulator
          path: mobile/ios/App/DerivedData/Build/Products/Debug-iphonesimulator/TigerTest-Simulator.zip
