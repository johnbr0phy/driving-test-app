name: Question audit

# Daily (not Mondays): only the questions flagged by answer statistics or
# reported by students since the last run (--signals), so a suspected wrong key
# is checked the morning after the nightly flags (03:40 UTC) raise it. A key
# the judge finds right is cleared on /admin; a confirmed problem gets the same
# fix PR as below.
#
# Weekly: Claude re-answers about 1,000 questions blind plus everything reported,
# flagged or due for a dated change (scripts/question-audit.ts), then Claude
# Code fixes the confirmed findings in the bank sources and opens a PR. Nothing
# merges without review: the PR is the approval step. The PR carries
# audits/resolutions/<date>.json, so merging it closes the findings on /admin
# and restarts the fixed questions' answer statistics (the resolve job).
#
# Needs repository secrets ANTHROPIC_API_KEY and FIREBASE_SERVICE_ACCOUNT_KEY
# (without the Firebase key it runs the sweep and freshness checks only).

on:
  # A reviewed audits/resolutions/<date>.json reaching main closes those findings on /admin.
  push:
    branches: [main]
    paths: ["audits/resolutions/**"]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC: everything
    - cron: "47 4 * * 0,2-6" # other days 04:47 UTC: new flags and reports only
  workflow_dispatch:
    inputs:
      sweep:
        description: "Random questions to sweep"
        default: "1000"
      signals:
        description: "Only flagged and reported questions (what the daily run does)"
        type: boolean
        default: false
      export_open:
        description: "Only write the findings still open on /admin to the log and an artifact (no audit, no PR)"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: question-audit
  cancel-in-progress: false

jobs:
  resolve:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Close reviewed findings
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          for f in $(git diff --name-only --diff-filter=AM HEAD~1 HEAD -- audits/resolutions/); do
            npx tsx scripts/question-audit.ts --resolve "$f"
          done

  audit:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Index every question
        run: python3 -I tools/check_banks.py --export "$RUNNER_TEMP/questions.json"

      - name: Export open findings
        if: inputs.export_open
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: npx tsx scripts/question-audit.ts --index "$RUNNER_TEMP/questions.json" --export-open --out audits

      - name: Audit
        if: ${{ !inputs.export_open }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          SWEEP_INPUT: ${{ github.event.inputs.sweep }}
          SIGNALS: ${{ inputs.signals || github.event.schedule == '47 4 * * 0,2-6' }}
        run: |
          sweep="${SWEEP_INPUT:-1000}"
          case "$sweep" in ''|*[!0-9]*) echo "sweep must be a whole number"; exit 1 ;; esac
          mode=""
          if [ "$SIGNALS" = "true" ]; then mode="--signals"; fi
          npx tsx scripts/question-audit.ts --index "$RUNNER_TEMP/questions.json" --sweep "$sweep" --out audits $mode

      # Kept even when a later step fails, so a run's findings are never only in Firestore.
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: question-audit-${{ github.run_id }}
          path: audits/
          if-no-files-found: ignore

      - name: Count findings
        id: findings
        if: ${{ !inputs.export_open }}
        run: |
          f="audits/$(date -u +%F).json"
          # A daily run with nothing new to check writes no report.
          if [ ! -f "$f" ]; then echo "count=0" >> "$GITHUB_OUTPUT"; exit 0; fi
          n=$(python3 -c 'import json,sys; print(len(json.load(open(sys.argv[1]))["findings"]))' "$f")
          echo "count=$n" >> "$GITHUB_OUTPUT"
          echo "file=$f" >> "$GITHUB_OUTPUT"
          echo "report=${f%.json}.md" >> "$GITHUB_OUTPUT"
          echo "resolutions=audits/resolutions/$(date -u +%F)-${{ github.run_id }}.json" >> "$GITHUB_OUTPUT"

      # If Claude Code cannot run, the PR still opens with the report, unfixed.
      - name: Fix findings with Claude Code
        if: ${{ !inputs.export_open && steps.findings.outputs.count != '0' }}
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --max-turns 200 --allowedTools "Read,Edit,Write,Glob,Grep,Bash(python3:*),Bash(npx tsx:*),Bash(git diff:*),Bash(git status:*)"
          prompt: |
            Read CLAUDE.md, then the question audit at ${{ steps.findings.outputs.report }}
            (details in ${{ steps.findings.outputs.file }}).

            For each finding, decide for yourself whether it is right: open the question
            in its bank and the exam's tools/**/sources.md, and check the rule. Fix only
            the ones you agree with. Fix the source the bank is built from (the Python or
            JSON under tools/ named in CLAUDE.md for that exam), never only the built JSON,
            then run that exam's build script so data/ matches. A key change must also be
            made in every translated bank of that exam (data/<bank>_<lang>.json).

            After all fixes run:
              python3 -I tools/check_banks.py
              npx tsx scripts/build-training-parts.ts
            and the exam's own validator (.claude/skills/exam-bank/scripts/validate_bank.py
            for v1 banks, tools/validate_v2_bank.py for v2), and fix anything they report.

            Finally append to ${{ steps.findings.outputs.report }} a section "## What was
            changed" listing each finding as Fixed (one line on the change) or Not changed
            (one line on why).

            Then write ${{ steps.findings.outputs.resolutions }}: a JSON array with one
            entry per finding you decided, { "id": "<examId>__<questionId>" (the two ids
            from the finding's heading), "status": "fixed" or "dismissed", "note": the
            same one line }. Use "dismissed" only when you checked the official rule and
            the finding is wrong; leave out any finding you could not settle, so it stays
            open. When the PR merges, this file closes those findings.

            Do not commit; the next step opens the PR.

      - name: Open PR
        if: ${{ !inputs.export_open && steps.findings.outputs.count != '0' }}
        uses: peter-evans/create-pull-request@v7
        with:
          branch: question-audit/${{ github.run_id }}
          title: "Question audit: ${{ steps.findings.outputs.count }} findings"
          commit-message: "Question audit fixes and report"
          body-path: ${{ steps.findings.outputs.report }}
          add-paths: |
            audits/**
            data/**
            tools/**
            lib/trainingParts.json
            lib/examBankSizes.json
            lib/v2/bankSizes.ts
