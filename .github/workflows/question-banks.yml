name: Question banks

# Every PR that touches a question bank, its sources or the code that reads
# them. The integrity check (answer keys, duplicate options, translations
# against their base bank, v2 stimulus references) blocks the merge; the
# house-style validators run on the banks the PR changed and only warn, since
# some older banks predate them.

on:
  pull_request:
    paths:
      - "data/**"
      - "tools/**"
      - "lib/banks/**"
      - "lib/v2/banks/**"
      - "lib/exams.ts"
      - "lib/trainingParts.json"
      - "lib/examBankSizes.json"
      - "lib/examFreshness.json"
      - "lib/examSources.json"
      - "scripts/build-training-parts.ts"
      - ".claude/skills/exam-bank/scripts/**"
      - ".github/workflows/question-banks.yml"
  push:
    branches: [main]
    paths: ["data/**", "tools/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bank integrity (blocking)
        run: python3 -I tools/check_banks.py

      - name: No new answer patterns (blocking)
        # A word that marks the key ("tell the supervisor" in 43 of 51 RBT
        # scenarios, Nov 2026) or a key reused word for word. The baseline
        # holds what older banks have today and may only shrink.
        run: python3 -I tools/check_answer_patterns.py --all --baseline tools/answer_patterns_baseline.json

      - name: Each question has its own options, and the key does not echo the stem (blocking)
        # The Nov 2026 "quartet" build (#876, #877): four questions sharing one
        # option set, each option keyed once, and keys that repeated the stem's
        # words, so picking the echo scored 44 to 49% blind. The baseline lists
        # older banks over a limit; they may only get better.
        run: python3 -I tools/check_option_reuse.py --all --baseline tools/option_reuse_baseline.json

      - name: Question stems and answers are not padded (blocking)
        # The Nov 2026 batch ran 20 to 26 words per stem against a site median
        # of 14, from scenario wrapping and stacked qualifiers. A bank's median
        # may not exceed 20 words; older banks over it are in the baseline and
        # may only get shorter.
        run: python3 -I tools/check_stem_length.py --all --baseline tools/stem_length_baseline.json

      - name: Key length rank is not a tell (blocking)
        # Nov 2026: writers kept the key just shorter than one distractor to pass
        # the key-longest rule, so "pick the second-longest option" scored 50% on
        # PALS and SHRM-CP. No bank may let one length rank score over 40%; older
        # banks over it are in the baseline and may only improve.
        run: python3 -I tools/check_length_rank.py --all --baseline tools/length_rank_baseline.json

      - name: Freshness registry is well formed (blocking)
        run: python3 -I tools/check_freshness.py

      - name: Source index is current (blocking)
        run: python3 -I tools/build_exam_sources.py --check

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Training parts and bank sizes are current (blocking)
        run: npx tsx scripts/build-training-parts.ts --check

      - name: House style on changed v1 banks (warning only)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "$base" HEAD -- 'data/*.json' | grep -v '_[a-z][a-z]\.json$' || true)
          status=0
          for f in $changed; do
            [ -f "$f" ] || continue
            echo "::group::$f"
            python3 -I .claude/skills/exam-bank/scripts/validate_bank.py "$f" || { status=1; echo "::warning file=$f::house-style validator failed"; }
            echo "::endgroup::"
          done
          exit $status
