name: Search gaps

# Daily: list the searches on tigertest.io that still find no test
# (scripts/search-gaps.ts, the same groups as the Searches tab on /admin), then
# Claude Code wires search aliases for the ones that name a test we have, builds
# at most one new test for the most-searched one we don't, and opens a PR.
# A PR that only adds aliases (lib/testCatalog.ts and its test, nothing else)
# merges itself once the checks pass (scripts/automerge-checks.sh). A PR with
# a new test, or one that touches anything else, always waits for a person.
#
# Needs repository secrets ANTHROPIC_API_KEY and FIREBASE_SERVICE_ACCOUNT_KEY.
# Run it by hand with "build" set to force a named test (no Firestore needed).

on:
  schedule:
    - cron: "41 7 * * *" # 07:41 UTC, about 2:41am New York, PR ready by morning
  workflow_dispatch:
    inputs:
      build:
        description: "Build this test regardless of search counts (e.g. Google Cloud Professional Cloud Architect). Empty: pick from searches."
        default: ""
      min:
        description: "Searches in 30 days before a missing test is built"
        default: "2"
      aliases_only:
        description: "Only wire aliases, build no new test"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

concurrency:
  group: search-gaps
  cancel-in-progress: false

jobs:
  gaps:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: List search gaps
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
          MIN_INPUT: ${{ github.event.inputs.min }}
        run: |
          min="${MIN_INPUT:-2}"
          case "$min" in ''|*[!0-9]*) echo "min must be a whole number"; exit 1 ;; esac
          npx tsx scripts/search-gaps.ts --out "$RUNNER_TEMP/gaps" --min "$min"
          echo "REPORT=$RUNNER_TEMP/gaps/$(date -u +%F)" >> "$GITHUB_ENV"

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: search-gaps-${{ github.run_id }}
          path: ${{ runner.temp }}/gaps/
          if-no-files-found: ignore

      # If Claude Code cannot finish, whatever it changed still goes to review.
      - name: Wire aliases and build with Claude Code
        continue-on-error: true
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_args: --max-turns 500 --allowedTools "Read,Edit,Write,Glob,Grep,WebSearch,WebFetch,Bash(npm:*),Bash(npx:*),Bash(node:*),Bash(python3:*),Bash(git diff:*),Bash(git status:*),Bash(ls:*)"
          prompt: |
            Read CLAUDE.md. Today's search gaps are in ${{ env.REPORT }}.md, with details
            in ${{ env.REPORT }}.json: searches on the site that find no test, most-searched
            first, and "buildable", the keys searched ${{ github.event.inputs.min || '2' }}+ times in 30 days.

            Part 1, aliases. For each gap whose searcher clearly wants a test we already
            have (another language, an abbreviation, a nickname, a part of the exam like
            "hazard perception", a misspelling), add the words to that test's line in
            SEARCH_ALIASES in lib/testCatalog.ts, and add a case to CASES in
            tests/test-search-aliases.test.cjs: [query, the region most of its searches came
            from, the test id that must come first]. Check each with searchAllTests that it
            now comes first and is not partial, and that you did not push another test's
            searches off first place (run npm test). Skip junk, half-typed and ambiguous
            searches (say which in the report): a wrong alias is worse than none.

            Part 2, at most one new test. Build: "${{ github.event.inputs.build }}".
            If that is empty${{ github.event.inputs.aliases_only == 'true' && ', skip Part 2 (aliases only today)' || '' }}, take the most-searched "buildable" gap that is a real
            exam people prepare for, with a published official outline, not already covered
            by a test on the site (check lib/testCatalog.ts); if none qualifies, build nothing.
            Research comes first and decides whether you build. Follow step 0 of
            .claude/skills/exam-bank/SKILL.md in full before writing any spec or question:
              - Identify the body that owns the exam. With WebSearch, then WebFetch on the
                pages themselves (never a search snippet), read its current content outline or
                syllabus with revision date and weights, its candidate handbook or bulletin for
                the format, its news page for any newer version or dated change, and the
                primary law, standard or official manual the outline points to.
              - Write every fact in a question from those primary texts. Prep sites may only
                support format facts the owner does not publish, labelled "guides say", and
                only when two agree. No sample, past or commercial questions, even reworded.
              - Leave out fees, fines, indexed limits, office-holders, current affairs and
                anything in a pending reform.
              - Write tools/next100/<examId>/sources.md as the skill describes and run
                python3 -I tools/check_sources.py <examId>; fix it until it passes.
            Stop rule: if you cannot fetch an official outline, syllabus, handbook or primary
            law, do not build it. Try the next "buildable" gap once; if that also fails, build
            nothing and say in the report what you searched and why it was not enough.

            Then build it end to end with the exam-bank skill: follow the rest of
            .claude/skills/exam-bank/SKILL.md and .claude/skills/exam-bank/references/wiring.md
            exactly (spec from the official outline, the 200-question bank in house style,
            the validator, the full wiring, catalog entry, landing, examFacts, search aliases
            for the words people typed).

            Before you finish, check your own work against the sources: pick 25 questions
            spread across every category, and for each one re-open the source passage that
            supports its key and confirm the key, the explanation and that no other option is
            defensible. Fix or drop any that fail and say how many you changed. Write the gap's
            key (or the forced name) on one line to ${{ runner.temp }}/built.txt.

            Then run and fix everything reported by:
              npm run typecheck
              npm run lint
              npm test
              python3 -I tools/check_banks.py
              npx tsx scripts/build-training-parts.ts
            and, if you built one, the exam's validator and
              python3 -I tools/check_sources.py <examId>

            Finally append to ${{ env.REPORT }}.md a section "## What was changed": each alias
            added (search, test), each gap skipped and why in a few words, and the test built
            (name, question count, official outline and revision used, every source URL from
            sources.md with what it gave you, what could not be confirmed, and the result of
            the 25-question source check) or why none was. Do not commit;
            the next step opens the PR.

      - name: Mark the built test Planned on /admin
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}
        run: |
          f="$RUNNER_TEMP/built.txt"
          [ -s "$f" ] || exit 0
          key="$(head -n1 "$f")"
          echo "BUILT=$key" >> "$GITHUB_ENV"
          npx tsx scripts/search-gaps.ts --mark-planned "$key" || echo "Could not mark Planned"

      # Alias-only means exactly these two files changed and no test was built.
      - name: Is it aliases only?
        id: scope
        run: |
          changed=$(git status --porcelain --untracked-files=all | awk '{print $NF}')
          other=$(echo "$changed" | grep -v -x -e 'lib/testCatalog.ts' -e 'tests/test-search-aliases.test.cjs' -e '' || true)
          if [ -n "$changed" ] && [ -z "$other" ] && [ -z "${BUILT:-}" ]; then
            echo "aliases_only=true" >> "$GITHUB_OUTPUT"
          else
            echo "aliases_only=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the aliases
        id: checks
        if: steps.scope.outputs.aliases_only == 'true'
        continue-on-error: true
        run: bash scripts/automerge-checks.sh

      # No changes, no PR.
      - name: Open PR
        id: pr
        uses: peter-evans/create-pull-request@v7
        with:
          branch: search-gaps/${{ github.run_id }}
          title: "Search gaps ${{ github.run_id }}: aliases${{ env.BUILT && format(' + new test: {0}', env.BUILT) || '' }}"
          commit-message: "Search gaps: aliases and new test"
          body-path: ${{ env.REPORT }}.md
          add-paths: |
            app/**
            components/**
            data/**
            lib/**
            public/**
            tests/**
            tools/**
            types/**
            i18n/**
            .claude/skills/**

      - name: Merge an aliases-only PR
        if: steps.pr.outputs.pull-request-number && steps.scope.outputs.aliases_only == 'true' && steps.checks.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge "${{ steps.pr.outputs.pull-request-number }}" --squash --delete-branch

      - name: Say why an aliases-only PR was not merged
        if: steps.pr.outputs.pull-request-number && steps.scope.outputs.aliases_only == 'true' && steps.checks.outcome != 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr comment "${{ steps.pr.outputs.pull-request-number }}" --body "Not merged automatically: a check failed in run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}. Fix it and merge, or close it.

          ---
          _Generated by [Claude Code](https://claude.ai/code)_"
